[project]
name = "prisma"
version = "0.1.0"
description = "Conversation-driven video editor skill for Codex and Claude Code"
license = { file = "LICENSE" }
# Capped below 3.14: torch publishes no cp314 wheels, which silently broke BOTH
# torch-backed extras (matting, whisperx) for anyone whose uv picked 3.14. The
# base install works fine on 3.14 — the cap exists so the extras stay installable.
requires-python = ">=3.10,<3.14"
dependencies = [
    "requests",
    "pillow",
    "numpy",
    # Face/eye tracking for the Phase-2 dynamic camera (face_track.py). Pinned:
    # opencv-python-headless 5.0.0.93 ships without CascadeClassifier and breaks
    # Haar detection — stay on the 4.10 line. Headless = no GUI/Qt deps.
    "opencv-python-headless==4.10.0.84",
    # Transcription with forced alignment (transcribe.py). A BASE dependency on
    # purpose: the skill must work with nothing to sign up for and no second
    # thing to install. It pulls torch + faster-whisper (~2GB of wheels), and
    # downloads a Whisper model plus a per-language wav2vec2 alignment model on
    # first run. That weight is the price of a keyless install.
    "whisperx",
    # Editing from a URL (ingest_url.py). A dependency and not a system package
    # on purpose: as an "optional" brew/winget install nobody had it, so the
    # feature looked broken to anyone who pasted a link. In the venv it is always
    # there, on every OS, and `uv run` puts .venv/bin first on PATH so the helper
    # that shells out to `yt-dlp` finds it.
    "yt-dlp",
    # Shot-boundary detection for the reframe pipeline (scene_detection.py).
    # Pure Python + OpenCV, no model download — light enough to ship in base.
    "scenedetect",
    "librosa>=0.11.0",
]

[project.optional-dependencies]
animations = ["manim"]
# Person matting for the "element behind the subject" effect (person_matte.py).
# Robust Video Matting via torch.hub — heavy (~2GB), so it's opt-in: install with
# `uv sync --extra matting`. Base install stays light for users who don't need it.
matting = ["torch", "torchvision"]
# Neural shot-boundary detection for scene_detection.py (--engine transnetv2).
# Markedly better than the default ContentDetector on fast motion, flashes and
# gradual transitions, but pulls torch — opt-in with `uv sync --extra scenes-neural`.
scenes-neural = ["torch", "transnetv2-pytorch"]
# Speaker diarization (diarize.py) for multi-voice sources (interview/podcast).
# Pulls torch + pretrained models gated behind a free HuggingFace account —
# opt-in with `uv sync --extra diarize`. Solo talking-head sources never need it.
diarize = ["torch", "pyannote.audio"]
# Face detection for the 9:16 auto-reframe camera (reframe.py). MediaPipe's
# BlazeFace is what makes the crop FOLLOW the speaker instead of sitting in a
# fixed centre cut — without it reframe.py falls back to the Haar cascade
# face_track.py already uses, which misses profile faces and jitters. ~200MB of
# wheels, so it's opt-in: `uv sync --extra reframe`.
reframe = ["mediapipe"]
# Optional transcription engine (transcribe.py --engine parakeet): NVIDIA Parakeet
# TDT 0.6B v3 (CC-BY-4.0) run through sherpa-onnx (Apache-2.0), CPU, no torch.
# Opt-in with `uv sync --extra parakeet`; the default WhisperX install is
# untouched. The int8 ONNX model is separate — see references/transcription.md.
parakeet = ["sherpa-onnx"]
# Trilha cinematografica (skill trilha-cinematografica): loudness por camada e reverb/EQ
# de sala. O separador de voz (audio-separator) NAO entra aqui: exige Python 3.11 num
# ambiente proprio (ver ~/Prisma-Suite/ECOSYSTEM.md).
cinematic = ["pyloudnorm", "pedalboard"]

# The one-command installer: `uvx --from git+<repo> prisma-install`, or plain
# `uvx prisma-install` once this is on PyPI. Stdlib-only, so it runs before any
# dependency exists — see prisma_install.py.
[project.scripts]
prisma-install = "prisma_install:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["prisma_install"]
